name: Deploy to pi4

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # use port 2204 when scanning host key
          ssh-keyscan -p 2204 ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy code
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p 2204 -o StrictHostKeyChecking=no \
            ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} \
            "set -eu; cd '${{ secrets.PI_DIR }}'; git fetch origin main; git merge --ff-only origin/main; test \"\$(git rev-parse HEAD)\" = \"\$(git rev-parse origin/main)\""

      - name: Restart GrokCam service
        env:
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_NAME"
          ssh -i ~/.ssh/id_ed25519 -p 2204 \
            ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} \
            "set -eu; sudo systemctl restart '$SERVICE_NAME'; sudo systemctl is-active --quiet '$SERVICE_NAME'"
